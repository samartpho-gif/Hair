<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title { font-size: clamp(2rem, 4vw, 3rem); }
    .order-wrap { max-width: 560px; margin: 0 auto; }
    .field { margin-bottom: var(--space-4); }
    .field label {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--beige-deep);
      margin-bottom: 0.1rem;
    }
    .field textarea { resize: vertical; line-height: 1.7; }
    .order-actions { text-align: center; margin-top: var(--space-5); }
    .order-actions .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .order-actions .btn:disabled:hover { background: transparent; color: var(--ink); }
    .order-note { text-align: center; font-size: 0.9rem; margin: var(--space-2) auto 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <span class="rule"></span>
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <div class="order-wrap">
          <form id="orderForm">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <textarea id="items" name="items" rows="2" required></textarea>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="text" id="total" name="total" inputmode="numeric" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3"></textarea>
            </div>

            <div class="order-actions">
              <button type="submit" class="btn btn--accent">ยืนยันสั่งซื้อ</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Body Scent — เติมเสน่ห์กลิ่นหอมที่ใช่</p>
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
