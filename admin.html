<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title { font-size: clamp(2rem, 4vw, 3rem); }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line-soft); }
    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.7;
    }
    #ordersTable th, #ordersTable td {
      text-align: left;
      vertical-align: top;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line-soft);
    }
    #ordersTable thead th {
      font-weight: 400;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--accent);
      white-space: nowrap;
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--cream); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <span class="rule"></span>
          <p>เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-scroll">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Body Scent — เติมเสน่ห์กลิ่นหอมที่ใช่</p>
      <p>&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
